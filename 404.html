<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada - Lucas Oliveira</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e0e14" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/images/favicon-16x16.png"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/proprieties.css" />
  </head>
  <body>
    <main class="pagina-404">
      <p class="codigo-404">404</p>
      <h1>Página não encontrada</h1>
      <p>A página que você procura não existe ou foi movida.</p>
      <div class="acoes-404">
        <a class="ButtonCustom" href="/">Voltar ao início</a>
        <a class="ButtonSend outline" href="/#projetos">Ver projetos</a>
      </div>
    </main>
  </body>
</html>
